<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="lifecycleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">Docker Container Lifecycle</text>
  
  <!-- Created State -->
  <rect x="50" y="100" width="100" height="50" rx="8" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  <text x="100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Created</text>
  
  <!-- Arrow: Created to Running -->
  <path d="M 150 125 L 200 125" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="175" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3498db">start</text>
  
  <!-- Running State -->
  <rect x="200" y="100" width="100" height="50" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Running</text>
  
  <!-- Arrow: Running to Paused -->
  <path d="M 250 150 L 250 200" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="270" y="180" font-family="Arial, sans-serif" font-size="9" fill="#3498db">pause</text>
  
  <!-- Paused State -->
  <rect x="200" y="200" width="100" height="50" rx="8" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
  <text x="250" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Paused</text>
  
  <!-- Arrow: Paused to Running -->
  <path d="M 240 200 L 240 150" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="220" y="180" font-family="Arial, sans-serif" font-size="9" fill="#3498db">unpause</text>
  
  <!-- Arrow: Running to Stopped -->
  <path d="M 300 125 L 380 125" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3498db">stop</text>
  
  <!-- Stopped State -->
  <rect x="380" y="100" width="100" height="50" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Stopped</text>
  
  <!-- Arrow: Stopped to Running -->
  <path d="M 420 100 L 290 100" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="355" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3498db">start</text>
  
  <!-- Arrow: Stopped to Deleted -->
  <path d="M 480 125 L 550 125" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="515" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3498db">rm</text>
  
  <!-- Deleted State -->
  <rect x="550" y="100" width="100" height="50" rx="8" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Deleted</text>
  
  <!-- Command examples -->
  <rect x="50" y="270" width="700" height="60" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="295" font-family="monospace" font-size="11" fill="#2c3e50">docker create → docker start → docker pause/unpause → docker stop → docker rm</text>
  <text x="70" y="315" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Common commands: docker ps (list), docker logs (view output), docker exec (run commands)</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
</svg>
