<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2496ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7bc4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Docker Architecture</text>
  
  <!-- Docker Client -->
  <rect x="50" y="80" width="150" height="80" rx="10" fill="url(#headerGrad)" stroke="#1a7bc4" stroke-width="2"/>
  <text x="125" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Docker Client</text>
  <text x="125" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0">(CLI / API)</text>
  
  <!-- Arrow Client to Daemon -->
  <path d="M 200 120 L 280 120" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">REST API</text>
  
  <!-- Docker Daemon -->
  <rect x="280" y="60" width="180" height="120" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="370" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Docker Daemon</text>
  <text x="370" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0">(dockerd)</text>
  <text x="370" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Manages Docker Objects</text>
  
  <!-- Arrow Daemon to Registry -->
  <path d="M 460 120 L 540 120" stroke="#3498db" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="500" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Pull/Push</text>
  
  <!-- Docker Registry -->
  <rect x="540" y="80" width="150" height="80" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="615" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Docker Registry</text>
  <text x="615" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0e0e0">(Docker Hub)</text>
  
  <!-- Images -->
  <rect x="200" y="220" width="120" height="60" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="260" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Images</text>
  <text x="260" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Read-only templates</text>
  
  <!-- Containers -->
  <rect x="340" y="220" width="120" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Containers</text>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Runnable instances</text>
  
  <!-- Networks -->
  <rect x="480" y="220" width="120" height="60" rx="8" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
  <text x="540" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Networks</text>
  <text x="540" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Container networking</text>
  
  <!-- Volumes -->
  <rect x="620" y="220" width="120" height="60" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="680" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Volumes</text>
  <text x="680" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e0e0e0">Persistent storage</text>
  
  <!-- Arrows from Daemon to objects -->
  <path d="M 370 180 L 260 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 370 180 L 400 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 370 180 L 540 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 370 180 L 680 220" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="50" y="310" width="700" height="70" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="335" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Components:</text>
  
  <rect x="70" y="345" width="15" height="15" fill="#2496ED"/>
  <text x="90" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Client</text>
  
  <rect x="140" y="345" width="15" height="15" fill="#3498db"/>
  <text x="160" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Daemon</text>
  
  <rect x="210" y="345" width="15" height="15" fill="#e74c3c"/>
  <text x="230" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Registry</text>
  
  <rect x="290" y="345" width="15" height="15" fill="#2ecc71"/>
  <text x="310" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Images</text>
  
  <rect x="370" y="345" width="15" height="15" fill="#9b59b6"/>
  <text x="390" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Containers</text>
  
  <rect x="470" y="345" width="15" height="15" fill="#f39c12"/>
  <text x="490" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Networks</text>
  
  <rect x="560" y="345" width="15" height="15" fill="#1abc9c"/>
  <text x="580" y="357" font-family="Arial, sans-serif" font-size="10" fill="#555">Volumes</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
</svg>
