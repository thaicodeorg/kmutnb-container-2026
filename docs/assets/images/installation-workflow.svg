<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">Docker Installation Workflow - CentOS 9 Stream</text>
  
  <!-- Step 1 -->
  <rect x="50" y="60" width="140" height="70" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 1</text>
  <text x="120" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Remove Old</text>
  <text x="120" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Docker Versions</text>
  
  <!-- Arrow 1 -->
  <path d="M 190 95 L 220 95" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2 -->
  <rect x="220" y="60" width="140" height="70" rx="8" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
  <text x="290" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 2</text>
  <text x="290" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Install</text>
  <text x="290" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">yum-utils</text>
  
  <!-- Arrow 2 -->
  <path d="M 360 95 L 390 95" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3 -->
  <rect x="390" y="60" width="140" height="70" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 3</text>
  <text x="460" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Add Docker</text>
  <text x="460" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Repository</text>
  
  <!-- Arrow 3 -->
  <path d="M 530 95 L 560 95" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4 -->
  <rect x="560" y="60" width="140" height="70" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="630" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 4</text>
  <text x="630" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Install</text>
  <text x="630" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Docker CE</text>
  
  <!-- Step 5 -->
  <rect x="50" y="160" width="140" height="70" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="120" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 5</text>
  <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Start Docker</text>
  <text x="120" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Service</text>
  
  <!-- Arrow 5 -->
  <path d="M 190 195 L 220 195" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6 -->
  <rect x="220" y="160" width="140" height="70" rx="8" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="290" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 6</text>
  <text x="290" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Enable Docker</text>
  <text x="290" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">on Boot</text>
  
  <!-- Arrow 6 -->
  <path d="M 360 195 L 390 195" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 7 -->
  <rect x="390" y="160" width="140" height="70" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="460" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Step 7</text>
  <text x="460" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Verify</text>
  <text x="460" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e0e0e0">Installation</text>
  
  <!-- Code blocks -->
  <rect x="50" y="260" width="700" height="120" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  <text x="70" y="285" font-family="monospace" font-size="11" fill="#2ecc71">$ sudo dnf remove docker docker-client docker-engine</text>
  <text x="70" y="305" font-family="monospace" font-size="11" fill="#2ecc71">$ sudo dnf install -y yum-utils</text>
  <text x="70" y="325" font-family="monospace" font-size="11" fill="#2ecc71">$ sudo dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo</text>
  <text x="70" y="345" font-family="monospace" font-size="11" fill="#2ecc71">$ sudo dnf install -y docker-ce docker-ce-cli containerd.io</text>
  <text x="70" y="365" font-family="monospace" font-size="11" fill="#2ecc71">$ sudo systemctl start docker && sudo systemctl enable docker</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
</svg>
